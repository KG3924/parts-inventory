name: Phone preview

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install and build for the preview path
        run: |
          npm ci
          npm run build -- --base /parts-inventory-preview/

      - name: Refuse secret keys in the published site
        run: sh scripts/refuse-shipped-secrets.sh dist

      - name: Publish the built site to the stable preview URL
        env:
          PREVIEW_DEPLOY_TOKEN: ${{ secrets.PREVIEW_DEPLOY_TOKEN }}
        run: |
          if [ -z "$PREVIEW_DEPLOY_TOKEN" ]; then
            echo "PREVIEW_DEPLOY_TOKEN is not set; preview site was not updated."
            exit 0
          fi
          git config user.email "preview@users.noreply.github.com"
          git config user.name "In-Mar preview"
          rm -rf /tmp/inmar-preview
          mkdir -p /tmp/inmar-preview
          cp -R dist/. /tmp/inmar-preview/
          cd /tmp/inmar-preview
          git init -b main
          git config user.email "preview@users.noreply.github.com"
          git config user.name "In-Mar preview"
          git add -A
          git commit -m "preview build"
          git -c http.extraheader="AUTHORIZATION: bearer ${PREVIEW_DEPLOY_TOKEN}" push --force "https://github.com/KG3924/parts-inventory-preview.git" main

      - name: Comment the stable phone preview link
        uses: actions/github-script@v7
        with:
          script: |
            const url = 'https://kg3924.github.io/parts-inventory-preview/';
            const marker = '<!-- inmar-phone-preview -->';
            const body = [
              marker,
              'Phone preview (this is **not** the live shop on main):',
              '',
              url,
              '',
              'After a new commit, hard-refresh that page (pull down in Safari, or empty cache in Chrome). The address stays the same so a saved login / Face ID prompt can stick while you test.',
              '',
              'Saved logins are tied to that exact address. After this PR is merged, unlock once more on https://kg3924.github.io/parts-inventory/ — do not expect the preview password prompt to appear on the live URL.',
              '',
              'Do **not** run `schema/auth_lock_after_merge.sql` until this PR is on main. Running it earlier locks the live no-login app out of stock.'
            ].join('\n');
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100
            });
            const mine = comments.find((c) => (c.body || '').includes(marker));
            if (mine) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: mine.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body
              });
            }
